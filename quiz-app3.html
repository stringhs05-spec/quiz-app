/* ══════════════════════════════════════════════════════════════
   インポート/エクスポートパネル
══════════════════════════════════════════════════════════════ */
function IOPanel({QS,setQS,gSt,setGSt,decks,setDecks,srs,setSRS,syncUrl,setSyncUrl,onClose}){
  const T=useT();
  const[msg,setMsg]=useState(null);
  const[confirmReset,setConfirmReset]=useState(null);
  const[pendingImport,setPendingImport]=useState(null);
  const[pendingBackup,setPendingBackup]=useState(null);
  const[syncUrlInput,setSyncUrlInput]=useState(syncUrl||"");
  const[pendingSync,setPendingSync]=useState(null);
  const[pendingSyncUpload,setPendingSyncUpload]=useState(null);
  const qRef=useRef(),sRef=useRef(),bRef=useRef();
  const flash=(text,ok=true)=>{setMsg({text,ok});setTimeout(()=>setMsg(null),3000);};

  // ── 全データバックアップ ──────────────────────────────────────
  const exportBackup=async()=>{
    const backup={
      _type:"econ_backup",version:1,
      exportedAt:new Date().toISOString(),
      decks,srs,stats:gSt,
    };
    await downloadJSON(backup,`econ_backup_${new Date().toLocaleDateString("ja-JP").replace(/\//g,"-")}.json`);
    flash(T.backupOk);
  };
  const importBackup=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const data=await readJSONFile(file);
      if(data._type!=="econ_backup"){flash(T.errNotBackup,false);return;}
      setPendingBackup(data);
    }catch(err){flash("エラー："+err.message,false);}
    e.target.value="";
  };
  const applyBackup=(mode)=>{
    const data=pendingBackup;
    if(mode==="overwrite"){
      // 全データ上書き
      if(data.decks){setDecks(data.decks);saveDecks(data.decks);}
      if(data.srs){setSRS(data.srs);saveSRS(data.srs);}
      if(data.stats){const st={...DEF_ST,...data.stats};setGSt(st);saveSt(st);}
      flash(T.overwriteOk);
    }else{
      // マージ：デッキはID重複スキップ、SRSはnextDueが新しい方を優先、statsはXPが高い方
      if(data.decks){
        const existIds=new Set(decks.map(d=>d.id));
        const merged=[...decks,...(data.decks||[]).filter(d=>!existIds.has(d.id))];
        setDecks(merged);saveDecks(merged);
      }
      if(data.srs){
        const merged={...data.srs};
        Object.entries(srs||{}).forEach(([id,v])=>{
          if(!merged[id]||v.nextDue>merged[id].nextDue) merged[id]=v;
        });
        setSRS(merged);saveSRS(merged);
      }
      if(data.stats&&gSt){
        const st={...DEF_ST,...data.stats,
          totalXP:Math.max(gSt.totalXP,data.stats.totalXP||0),
          plays:Math.max(gSt.plays,data.stats.plays||0),
          bestScore:Math.max(gSt.bestScore,data.stats.bestScore||0),
        };
        setGSt(st);saveSt(st);
      }
      flash(T.mergeOk);
    }
    setPendingBackup(null);
  };

  const exportQ=async()=>{
    await downloadJSON({_type:"econ_quiz_questions",version:1,questions:QS},
      `questions_${new Date().toLocaleDateString("ja-JP").replace(/\//g,"-")}.json`);
    flash(T.qsExported);
  };
  const importQ=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const data=await readJSONFile(file);const qs=data.questions||data;
      const err=validateQS(qs);if(err){flash("エラー："+err,false);return;}
      // 重複IDを除いた追加分
      const newIds=new Set(qs.map(q=>q.id));
      const merged=[...QS.filter(q=>!newIds.has(q.id)),...qs];
      if(QS.length===0){
        setQS(qs);flash(T.loadedN(qs.length));
      } else {
        setPendingImport({qs,merged});
      }
    }catch(err){flash("エラー："+err.message,false);}
    e.target.value="";
  };
  const exportProgress=async()=>{
    if(!gSt){flash(T.noStats,false);return;}
    const history=await loadAllHistory();
    await downloadJSON({_type:"econ_progress",version:2,
      exportedAt:new Date().toISOString(),srs,stats:gSt,history},
      `progress_${new Date().toLocaleDateString("ja-JP").replace(/\//g,"-")}.json`);
    flash(T.progressExported);
  };
  const importProgress=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const data=await readJSONFile(file);
      if(data._type!=="econ_progress"&&typeof data.totalXP!=="number"){
        flash(T.errProgressFormat,false);return;
      }
      if(data.srs){setSRS(data.srs);saveSRS(data.srs);}
      const st={...DEF_ST,...(data.stats||data)};
      setGSt(st);saveSt(st);
      if(data.history?.length){await saveAllHistory(data.history);}
      flash(T.progressImported);
    }catch(err){flash("エラー："+err.message,false);}
    e.target.value="";
  };
  const resetS=()=>{
    saveSt(DEF_ST);setGSt({...DEF_ST});flash(T.statsReset);
    setConfirmReset(null);
  };
  const resetQ=()=>{
    setQS(DEFAULT_QS);flash(T.qsReset);
    setConfirmReset(null);
  };
  const Btn=({onClick,color,children})=>(
    <button onClick={onClick} style={{background:color||"#1e1e36",border:`1px solid ${color||"#3a3a58"}`,

      fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"inherit",width:"100%",textAlign:"left"}}>
      {children}
    </button>
  );
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",
      display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:16}}>
      <div style={{background:"#13132a",border:"1px solid #2a2a44",borderRadius:18,maxHeight:"calc(100vh - 32px)",overflowY:"auto",
        padding:"24px 20px",width:"100%",maxWidth:360,display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:16,fontWeight:800,color:"#ece8d8"}}>{T.ioTitle}</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#666",fontSize:20,cursor:"pointer"}}>✕</button>
        </div>
        {msg&&<div style={{background:msg.ok?"rgba(34,197,94,0.12)":"rgba(239,68,68,0.12)",
          border:`1px solid ${msg.ok?"#22c55e":"#ef4444"}`,borderRadius:9,
          padding:"8px 12px",fontSize:13,color:msg.ok?"#4ade80":"#f87171"}}>{msg.text}</div>}

        {/* インポート方法の選択ダイアログ */}
        {pendingImport&&(
          <div style={{background:"#0d0d20",border:"1px solid #c9a84c",borderRadius:12,padding:"14px"}}>
            <div style={{fontSize:13,color:"#ece8d8",fontWeight:700,marginBottom:4}}>

            </div>
            <div style={{fontSize:11,color:"#888",marginBottom:12}}>
              
            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{
                setQS(pendingImport.merged);
                setPendingImport(null);

                {T.addBtn}
              </button>
              <button onClick={()=>{
                setQS(pendingImport.qs);
                setPendingImport(null);
                flash(T.replacedN(pendingImport.qs.length));

                padding:"8px 0",fontSize:12,color:"#aaa",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>

              </button>
              <button onClick={()=>setPendingImport(null)}

                ✕

        <div>

          {pendingBackup&&(

                <button onClick={()=>applyBackup("merge")}

            {confirmReset==="stats"?(

            <button onClick={resetS} style={{background:"#c04040",border:"none",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>✓</button>
            <button onClick={()=>setConfirmReset(null)} style={{background:"none",border:"1px solid #333",borderRadius:6,padding:"4px 8px",fontSize:12,color:"#555",cursor:"pointer",fontFamily:"inherit"}}>✕</button>
          </div>
        ):(
          <Btn onClick={()=>setConfirmReset("stats")} color="#c04040">{T.resetSBtn}</Btn>

        <div>
          <div style={{fontSize:11,color:"#666",letterSpacing:1,marginBottom:8}}>{T.syncSec}</div>
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <input value={syncUrlInput} onChange={e=>setSyncUrlInput(e.target.value)}
              placeholder={T.syncUrlPlaceholder}

            <button onClick={()=>{

              setSyncUrl(v);

              flash(v?"URL を保存しました":"同期を無効にしました");
            }} style={{background:"#1e1e36",border:"1px solid #3a3a58",borderRadius:8,
              padding:"8px 12px",fontSize:12,color:"#c9a84c",cursor:"pointer",
              fontFamily:"inherit",fontWeight:700,whiteSpace:"nowrap"}}>
              {T.syncSaveBtn}
            </button>
          </div>
          <div style={{fontSize:10,color:"#555",lineHeight:1.6}}>
            GAS ウェブアプリのURLを設定すると、セッション終了時・タブ切り替え時に自動でクラウドへ保存します。
          </div>
          {syncUrlInput.trim()&&(
            <>
            {pendingSyncUpload&&(
              <div style={{background:"#0d0d20",border:"1px solid #c9a84c",borderRadius:12,padding:"14px",marginTop:6}}>
                <div style={{fontSize:12,color:"#c9a84c",fontWeight:700,marginBottom:10}}>クラウドへ保存して上書きします</div>
                <SrsCmpTable
                  left={{label:"💻 ローカル（送信）",color:"#4ade80",
                    date:localStorage.getItem(SYNC_TS_KEY)?new Date(localStorage.getItem(SYNC_TS_KEY)).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"不明",
                    cats:srsCategories(srs),plays:gSt?.plays}}
                  right={{label:"☁️ クラウド（上書き先）",color:"#888",
                    date:pendingSyncUpload.remote?new Date(pendingSyncUpload.remote.exportedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"データなし",
                    cats:srsCategories(pendingSyncUpload.remote?.srs),plays:pendingSyncUpload.remote?.stats?.plays}}/>
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  <button onClick={async()=>{
                    const ok=await syncSave(syncUrlInput.trim(),srs,gSt,{force:true});
                    setPendingSyncUpload(null);
                    flash(ok?T.syncUploadOk:T.syncUploadErr,ok);
                  }} style={{flex:1,background:"#1e3a1e",border:"1px solid #22c55e",borderRadius:8,
                    padding:"8px 0",fontSize:12,color:"#4ade80",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                    ✓ 保存する
                  </button>
                  <button onClick={()=>setPendingSyncUpload(null)}
                    style={{background:"none",border:"1px solid #333",borderRadius:8,
                      padding:"8px 12px",fontSize:12,color:"#555",cursor:"pointer",fontFamily:"inherit"}}>✕</button>
                </div>
              </div>

            {pendingSync&&(
              <div style={{background:"#0d0d20",border:"1px solid #c9a84c",borderRadius:12,padding:"14px",marginTop:6}}>
                <div style={{fontSize:12,color:"#c9a84c",fontWeight:700,marginBottom:10}}>クラウドのデータを確認</div>
                <SrsCmpTable
                  left={{label:"☁️ クラウド",color:"#c9a84c",
                    date:new Date(pendingSync.remote.exportedAt).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}),
                    cats:srsCategories(pendingSync.remote.srs),plays:pendingSync.remote.stats?.plays}}
                  right={{label:"💻 ローカル",color:"#888",
                    date:localStorage.getItem(SYNC_TS_KEY)?new Date(localStorage.getItem(SYNC_TS_KEY)).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}):"不明",
                    cats:srsCategories(srs),plays:gSt?.plays}}/>
                <div style={{display:"flex",gap:8,marginTop:12}}>
                  <button onClick={()=>{
                    const remote=pendingSync.remote;
                    if(remote.srs){setSRS(remote.srs);saveSRS(remote.srs);}
                    if(remote.stats){const st={...DEF_ST,...remote.stats};setGSt(st);saveSt(st);}
                    if(remote.history?.length){saveAllHistory(remote.history);}
                    setPendingSync(null);flash(T.syncLoadOk);
                  }} style={{flex:1,background:"#1e3a1e",border:"1px solid #22c55e",borderRadius:8,
                    padding:"8px 0",fontSize:12,color:"#4ade80",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>

        </div>
        <details style={{fontSize:11,color:"#555",cursor:"pointer"}}>

          <pre style={{background:"#0d0d20",borderRadius:8,padding:"10px",fontSize:10,color:"#aaa",overflow:"auto",lineHeight:1.6}}>{`{

}
※ id はランダムな8文字で。同じ問題を微修正するときは

/* ══════════════════════════════════════════════════════════════
   デッキ管理パネル
══════════════════════════════════════════════════════════════ */
function DeckManagerPanel({decks,setDecks,QS,onClose}){
  const T=useT();
  const[msg,setMsg]=useState(null);
  const[editId,setEditId]=useState(null);
  const[editName,setEditName]=useState("");
  const[cardEditDeck,setCardEditDeck]=useState(null);
  const[selected,setSelected]=useState(new Set());
  const[confirmDeleteId,setConfirmDeleteId]=useState(null);
  const[editFolder,setEditFolder]=useState("");
  // デッキ一括操作用
  const[deckSelected,setDeckSelected]=useState(new Set());
  const[bulkMode,setBulkMode]=useState(false);
  const[bulkFolder,setBulkFolder]=useState("");
  const[showBulkFolder,setShowBulkFolder]=useState(false);
  // フォルダ折りたたみ状態（ホーム画面と共通のキーを使用）
  const[mgrOpenFolders,setMgrOpenFolders]=useState(()=>{
    try{return new Set(JSON.parse(localStorage.getItem('econ_open_folders')||'[]'));}
    catch{return new Set();}
  });
  const toggleMgrFolder=name=>{
    setMgrOpenFolders(prev=>{
      const s=new Set(prev);
      s.has(name)?s.delete(name):s.add(name);
      localStorage.setItem('econ_open_folders',JSON.stringify([...s]));
      return s;
    });
  };
  // フォルダ別グループ化＋名前順ソート（ホーム画面と同じロジック）
  const mgrFolderGroups=useMemo(()=>{
    const g={};
    decks.forEach(dk=>{const f=dk.folder||'';if(!g[f])g[f]=[];g[f].push(dk);});
    Object.values(g).forEach(arr=>arr.sort((a,b)=>natCompare(a.name,b.name)));
    return g;
  },[decks]);
  const mgrFolderNames=useMemo(()=>Object.keys(mgrFolderGroups).sort((a,b)=>{
    if(a===''&&b!=='')return 1;
    if(a!==''&&b==='')return -1;
    return natCompare(a,b);
  }),[mgrFolderGroups]);
  const fileRef=useRef();
  const addRef=useRef();
  const flash=(text,ok=true)=>{setMsg({text,ok});setTimeout(()=>setMsg(null),3000);};

  // デッキ選択トグル
  const toggleDeck=id=>setDeckSelected(prev=>{
    const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;
  });
  const toggleAllDecks=()=>setDeckSelected(prev=>
    prev.size===decks.length?new Set():new Set(decks.map(d=>d.id))
  );

  // 一括インポート（複数ファイル対応）
  const importDeck=async e=>{
    const files=Array.from(e.target.files);if(!files.length)return;
    let added=0,errors=[];
    const existIds=new Set(decks.map(d=>d.id));
    const newDecks=[...decks];
    for(const file of files){
      try{
        const data=await readJSONFile(file);
        const qs=data.questions||data;
        const err=validateQS(qs);if(err){errors.push(file.name+": "+err);continue;}
        const name=data.session||file.name.replace(/\.json$/,"");
        const id="dk_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);
        if(!existIds.has(id)){
          newDecks.push({id,name,questions:qs,createdAt:new Date().toISOString()});
          existIds.add(id);
          added++;
        }
      }catch(err){errors.push(file.name+": "+err.message);}
    }
    setDecks(newDecks);saveDecks(newDecks);
    if(errors.length) flash(errors.join(" / "),false);
    else flash(added+"個のデッキを追加しました");
    e.target.value="";
  };

  const deleteDeck=id=>{
    const updated=decks.filter(d=>d.id!==id);setDecks(updated);saveDecks(updated);
    setConfirmDeleteId(null);
  };

  // 一括削除
  const bulkDelete=()=>{
    if(deckSelected.size===0)return;
    const updated=decks.filter(d=>!deckSelected.has(d.id));
    setDecks(updated);saveDecks(updated);
    flash(deckSelected.size+"個のデッキを削除しました");
    setDeckSelected(new Set());setBulkMode(false);
  };

  // 一括フォルダ変更
  const bulkChangeFolder=()=>{
    if(deckSelected.size===0)return;
    const updated=decks.map(d=>deckSelected.has(d.id)?{...d,folder:bulkFolder}:d);
    setDecks(updated);saveDecks(updated);
    flash(deckSelected.size+"個のデッキのフォルダを変更しました");
    setDeckSelected(new Set());setBulkMode(false);setShowBulkFolder(false);setBulkFolder("");
  };

  const saveName=id=>{
    const updated=decks.map(d=>d.id===id?{...d,name:editName,folder:editFolder}:d);
    setDecks(updated);saveDecks(updated);setEditId(null);
  };
  const exportDeck=async dk=>{
    await downloadJSON({_type:"econ_quiz_questions",version:1,session:dk.name,questions:dk.questions},
      dk.name.replace(/\s/g,"_")+".json");
    flash(T.exportedDeck(dk.name));
  };

  // カード編集：削除
  const deleteSelected=()=>{
    if(selected.size===0)return;
    const updated=decks.map(d=>d.id===cardEditDeck.id
      ?{...d,questions:d.questions.filter(q=>!selected.has(q.id))}:d);
    setDecks(updated);saveDecks(updated);
    const newDk=updated.find(d=>d.id===cardEditDeck.id);
    setCardEditDeck(newDk);
    setSelected(new Set());
    flash(T.deletedN(selected.size));
  };

  // カード編集：JSONから追加
  const addCards=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{
      const data=await readJSONFile(file);
      const qs=data.questions||data;
      const err=validateQS(qs);if(err){flash("エラー："+err,false);return;}
      const existIds=new Set(cardEditDeck.questions.map(q=>q.id));
      const newQs=qs.filter(q=>!existIds.has(q.id));
      const merged=[...cardEditDeck.questions,...newQs];
      const updated=decks.map(d=>d.id===cardEditDeck.id?{...d,questions:merged}:d);
      setDecks(updated);saveDecks(updated);
      const newDk=updated.find(d=>d.id===cardEditDeck.id);
      setCardEditDeck(newDk);
      flash(T.addedN(newQs.length,qs.length-newQs.length));
    }catch(err){flash("エラー："+err.message,false);}
    e.target.value="";
  };

  const toggleCard=id=>setSelected(prev=>{
    const s=new Set(prev);s.has(id)?s.delete(id):s.add(id);return s;
  });
  const toggleAll=()=>setSelected(prev=>
    prev.size===cardEditDeck.questions.length?new Set():new Set(cardEditDeck.questions.map(q=>q.id))
  );

  // カード編集画面
  if(cardEditDeck){
    const dk=cardEditDeck;
    const allChecked=selected.size===dk.questions.length&&dk.questions.length>0;
    return(
      <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.80)",
        display:"flex",alignItems:"flex-start",justifyContent:"center",
        zIndex:200,padding:16,overflowY:"auto"}}>
        <div style={{background:"#13132a",border:"1px solid #2a2a44",borderRadius:18,maxHeight:"calc(100vh - 32px)",overflowY:"auto",
          padding:"20px 18px",width:"100%",maxWidth:460,display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <button onClick={()=>{setCardEditDeck(null);setSelected(new Set());}}
              style={{background:"none",border:"none",color:"#888",fontSize:18,cursor:"pointer"}}>←</button>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:800,color:"#ece8d8"}}>{dk.name}</div>
              <div style={{fontSize:11,color:"#555"}}>{dk.questions.length}問</div>
            </div>
          </div>
          {msg&&<div style={{background:msg.ok?"rgba(34,197,94,0.12)":"rgba(239,68,68,0.12)",
            border:`1px solid ${msg.ok?"#22c55e":"#ef4444"}`,borderRadius:9,
            padding:"8px 12px",fontSize:13,color:msg.ok?"#4ade80":"#f87171"}}>{msg.text}</div>}

          {/* ツールバー */}
          <div style={{display:"flex",alignItems:"center",gap:8,background:"#0d0d20",borderRadius:10,padding:"10px 12px"}}>
            <label style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",userSelect:"none"}}>
              <input type="checkbox" checked={allChecked} onChange={toggleAll}
                style={{width:16,height:16,accentColor:"#c9a84c"}}/>
              <span style={{fontSize:12,color:"#aaa"}}>
                {selected.size>0?T.selectedN(selected.size):T.selectAll}
              </span>
            </label>
            <div style={{flex:1}}/>
            {selected.size>0&&(
              <button onClick={deleteSelected}
                style={{background:"#3a1010",border:"1px solid #c04040",borderRadius:8,
                  padding:"5px 12px",fontSize:12,color:"#f87171",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
                {T.deleteN(selected.size)}
              </button>
            )}
            <button onClick={()=>addRef.current.click()}
              style={{background:"#1e3a1e",border:"1px solid #22c55e",borderRadius:8,
                padding:"5px 12px",fontSize:12,color:"#4ade80",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
              {T.addCardsBtn}
            </button>
            <input ref={addRef} type="file" accept=".json" style={{display:"none"}} onChange={addCards}/>
          </div>

          {/* カード一覧 */}
          <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:"60vh",overflowY:"auto"}}>
            {dk.questions.map((q,idx)=>{
              const checked=selected.has(q.id);
              const ans=getCA(q).join(" / ");
              const shortQ=q.q.length>44?q.q.slice(0,44)+"…":q.q;
              return(
                <label key={q.id} style={{display:"flex",alignItems:"flex-start",gap:10,
                  background:checked?"rgba(201,168,76,0.08)":"#0d0d20",
                  border:`1px solid ${checked?"#c9a84c":"#1e1e32"}`,
                  borderRadius:10,padding:"10px 12px",cursor:"pointer",userSelect:"none"}}>
                  <input type="checkbox" checked={checked} onChange={()=>toggleCard(q.id)}
                    style={{width:16,height:16,marginTop:2,accentColor:"#c9a84c",flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,color:checked?"#ece8d8":"#aaa",fontWeight:700,lineHeight:1.5}}>
                      <span style={{color:"#555",marginRight:4,fontSize:11}}>#{idx+1}</span>{shortQ}
                    </div>
                    <div style={{fontSize:11,color:"#c9a84c",marginTop:2}}>→ {ans}</div>
                  </div>
                </label>
              );
            })}
            {dk.questions.length===0&&<div style={{color:"#555",fontSize:13,textAlign:"center",padding:"16px 0"}}>
              {T.noCards}
            </div>}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.80)",
      display:"flex",alignItems:"flex-start",justifyContent:"center",
      zIndex:200,padding:16,overflowY:"auto"}}>
      <div style={{background:"#13132a",border:"1px solid #2a2a44",borderRadius:18,maxHeight:"calc(100vh - 32px)",overflowY:"auto",
        padding:"20px 18px",width:"100%",maxWidth:460,display:"flex",flexDirection:"column",gap:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:16,fontWeight:800,color:"#ece8d8"}}>{T.deckMgrTitle}</span>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#666",fontSize:20,cursor:"pointer"}}>✕</button>
        </div>
        {msg&&<div style={{background:msg.ok?"rgba(34,197,94,0.12)":"rgba(239,68,68,0.12)",
          border:`1px solid ${msg.ok?"#22c55e":"#ef4444"}`,borderRadius:9,
          padding:"8px 12px",fontSize:13,color:msg.ok?"#4ade80":"#f87171"}}>{msg.text}</div>}

        {decks.length===0&&<div style={{color:"#555",fontSize:13,textAlign:"center",padding:"16px 0"}}>
          <span style={{whiteSpace:"pre-line"}}>{T.noDecksImport}</span>
        </div>}

        {/* 一括操作バー */}
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>{setBulkMode(b=>!b);setDeckSelected(new Set());setShowBulkFolder(false);}}
            style={{background:bulkMode?"#c9a84c":"#1e1e36",border:`1px solid ${bulkMode?"#c9a84c":"#333"}`,
              borderRadius:8,padding:"5px 12px",fontSize:12,fontWeight:700,
              color:bulkMode?"#0d0d18":"#888",cursor:"pointer",fontFamily:"inherit"}}>
            {bulkMode?"選択終了":"複数選択"}
          </button>
          {bulkMode&&deckSelected.size>0&&(<>
            <button onClick={()=>{setShowBulkFolder(b=>!b);}}
              style={{background:"#1e3a4a",border:"1px solid #4a8aaa",borderRadius:8,padding:"5px 12px",
                fontSize:12,color:"#7ac8e8",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
              📁 フォルダ変更 ({deckSelected.size})
            </button>
            <button onClick={bulkDelete}
              style={{background:"#3a1010",border:"1px solid #c04040",borderRadius:8,padding:"5px 12px",
                fontSize:12,color:"#f87171",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>
              🗑 一括削除 ({deckSelected.size})
            </button>
          </>)}
          {bulkMode&&<label style={{display:"flex",alignItems:"center",gap:5,cursor:"pointer",marginLeft:"auto"}}>
            <input type="checkbox" checked={deckSelected.size===decks.length&&decks.length>0}
              onChange={toggleAllDecks} style={{accentColor:"#c9a84c"}}/>
            <span style={{fontSize:11,color:"#888"}}>全選択</span>
          </label>}
        </div>

        {/* フォルダ一括変更入力 */}
        {showBulkFolder&&(
          <div style={{display:"flex",gap:8,alignItems:"center",background:"#0d1a24",
            border:"1px solid #4a8aaa",borderRadius:10,padding:"10px 12px"}}>
            <span style={{fontSize:12,color:"#7ac8e8"}}>📁</span>
            <input value={bulkFolder} onChange={e=>setBulkFolder(e.target.value)}
              placeholder="新しいフォルダ名（空欄で解除）"
              style={{flex:1,background:"transparent",border:"none",outline:"none",
                color:"#ece8d8",fontSize:13,fontFamily:"inherit"}}/>
            <button onClick={bulkChangeFolder}
              style={{background:"#4a8aaa",border:"none",borderRadius:7,padding:"5px 12px",
                fontSize:12,fontWeight:700,color:"#fff",cursor:"pointer",fontFamily:"inherit"}}>適用</button>
          </div>
        )}

        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {mgrFolderNames.map(folderName=>{
          const folderDecks=mgrFolderGroups[folderName];
          const hasFolder=folderName!=='';
          const isCollapsed=hasFolder&&!mgrOpenFolders.has(folderName);
          return(
          <div key={folderName||'__none__'} style={{display:"flex",flexDirection:"column",gap:8}}>
            {hasFolder&&(
              <button onClick={()=>toggleMgrFolder(folderName)}
                style={{display:"flex",alignItems:"center",gap:8,width:"100%",
                  background:"none",border:"none",cursor:"pointer",
                  padding:"6px 2px 2px",fontFamily:"inherit"}}>
                <span style={{fontSize:11,color:"#4a6a88",fontWeight:700,letterSpacing:0.5}}>
                  {isCollapsed?"▶":"▼"} 📁 {folderName}
                </span>
                <span style={{fontSize:10,color:"#444",marginLeft:"auto"}}>
                  {folderDecks.length}
                </span>
              </button>
            )}
            {!isCollapsed&&folderDecks.map(dk=>(
            <div key={dk.id} style={{background:"#0d0d20",borderRadius:12,padding:"12px 14px",
              marginLeft:hasFolder?10:0,
              border:`1px solid ${bulkMode&&deckSelected.has(dk.id)?"#c9a84c":"transparent"}`}}>
              {editId===dk.id?(
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  <div style={{display:"flex",gap:8}}>
                    <input value={editName} onChange={e=>setEditName(e.target.value)}
                      onKeyDown={e=>e.key==="Enter"&&saveName(dk.id)}
                      style={{flex:1,background:"#1e1e3a",border:"1px solid #c9a84c",borderRadius:8,
                        padding:"6px 10px",color:"#ece8d8",fontSize:14,fontFamily:"inherit",outline:"none"}}
                      autoFocus/>
                    <button onClick={()=>saveName(dk.id)}
                      style={{background:"#c9a84c",border:"none",borderRadius:8,padding:"6px 12px",
                        fontSize:12,fontWeight:700,color:"#0d0d18",cursor:"pointer",fontFamily:"inherit"}}>{T.saveBtn}</button>
                    <button onClick={()=>setEditId(null)}
                      style={{background:"#1e1e36",border:"1px solid #333",borderRadius:8,padding:"6px 10px",
                        fontSize:12,color:"#888",cursor:"pointer",fontFamily:"inherit"}}>✕</button>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:6}}>
                    <span style={{fontSize:11,color:"#666"}}>📁</span>
                    <input value={editFolder} onChange={e=>setEditFolder(e.target.value)}
                      placeholder={T.folderPlaceholder}
                      style={{flex:1,background:"#1e1e3a",border:"1px solid #3a3a58",borderRadius:8,
                        padding:"5px 10px",color:"#aaa",fontSize:12,fontFamily:"inherit",outline:"none"}}/>
                  </div>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  {bulkMode&&(
                    <input type="checkbox" checked={deckSelected.has(dk.id)} onChange={()=>toggleDeck(dk.id)}
                      style={{width:16,height:16,accentColor:"#c9a84c",flexShrink:0,cursor:"pointer"}}/>
                  )}
                  <div style={{flex:1,cursor:"pointer",minWidth:0}}
                    onClick={()=>bulkMode?toggleDeck(dk.id):setCardEditDeck(dk)}>
                    <div style={{fontSize:14,fontWeight:700,color:"#ece8d8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{dk.name}</div>
                    <div style={{fontSize:11,color:"#555",marginTop:2}}>
                      {dk.folder&&<span style={{color:"#4a6a88",marginRight:6}}>📁 {dk.folder}</span>}
                      {dk.questions.length} · {T.deckEditSub}
                    </div>
                  </div>
                  {!bulkMode&&<>
                    <button onClick={()=>{setEditId(dk.id);setEditName(dk.name);setEditFolder(dk.folder||'');}}
                      style={{background:"none",border:"1px solid #333",borderRadius:7,padding:"4px 8px",
                        fontSize:11,color:"#888",cursor:"pointer",fontFamily:"inherit"}}>✏️</button>
                    <button onClick={()=>exportDeck(dk)}
                      style={{background:"none",border:"1px solid #333",borderRadius:7,padding:"4px 8px",
                        fontSize:11,color:"#888",cursor:"pointer",fontFamily:"inherit"}}>⬇</button>
                    {confirmDeleteId===dk.id?(
                      <div style={{display:"flex",gap:4,alignItems:"center"}}>
                        <span style={{fontSize:10,color:"#f87171"}}>{T.confirmDelDeck}</span>
                        <button onClick={()=>deleteDeck(dk.id)}
                          style={{background:"#c04040",border:"none",borderRadius:6,padding:"3px 8px",
                            fontSize:11,color:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:700}}>✓</button>
                        <button onClick={()=>setConfirmDeleteId(null)}
                          style={{background:"none",border:"1px solid #333",borderRadius:6,padding:"3px 6px",
                            fontSize:11,color:"#555",cursor:"pointer",fontFamily:"inherit"}}>✕</button>
                      </div>
                    ):(
                      <button onClick={()=>setConfirmDeleteId(dk.id)}
                        style={{background:"none",border:"1px solid #3a1010",borderRadius:7,padding:"4px 8px",
                          fontSize:11,color:"#f87171",cursor:"pointer",fontFamily:"inherit"}}>🗑</button>
                    )}
                  </>}
                </div>
              )}
            </div>
            ))}
          </div>
          );
          })}
        </div>

        <button onClick={()=>fileRef.current.click()}
          style={{background:"#1e1e36",border:"1px solid #c9a84c",borderRadius:10,
            padding:"11px",fontSize:14,fontWeight:700,color:"#c9a84c",cursor:"pointer",fontFamily:"inherit"}}>
          {T.addDeckBtn}（複数選択可）
        </button>
        <input ref={fileRef} type="file" accept=".json" multiple style={{display:"none"}} onChange={importDeck}/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   ロビー画面
══════════════════════════════════════════════════════════════ */
function Lobby({decks,srs,gSt,onPlayDeck,onPlayToday,onPlayReview,onPlayNew,onManageDecks,onSettings,savedGame,onResume,onClearSave,lang,onToggleLang}){
  const T=useT();
  const[openFolders,setOpenFolders]=useState(()=>{
    try{return new Set(JSON.parse(localStorage.getItem('econ_open_folders')||'[]'));}
    catch{return new Set();}
  });
  const toggleFolder=name=>{
    setOpenFolders(prev=>{
      const s=new Set(prev);
      s.has(name)?s.delete(name):s.add(name);
      localStorage.setItem('econ_open_folders',JSON.stringify([...s]));
      return s;
    });
  };
  const folderGroups=useMemo(()=>{
    const g={};
    decks.forEach(dk=>{const f=dk.folder||'';if(!g[f])g[f]=[];g[f].push(dk);});
    Object.values(g).forEach(arr=>arr.sort((a,b)=>natCompare(a.name,b.name)));
    return g;
  },[decks]);
  const folderNames=Object.keys(folderGroups).sort((a,b)=>{
    if(a===''&&b!=='')return 1;
    if(a!==''&&b==='')return -1;
    return natCompare(a,b);
  });
  const rank=gSt?getRank(gSt.totalXP):null;
  const freshSRSForLobby=loadSRS();
  const {review:_rev,newCards:_new}=buildTodaysDeck(decks,freshSRSForLobby);const todayCount=_rev.length+_new.length;
  const reviewCount=buildReviewDeck(decks,freshSRSForLobby,15,gSt?.questionStats||{}).length;
  const newCount=buildNewDeck(decks,freshSRSForLobby).length;
  const[deckDialog,setDeckDialog]=useState(null); // 選択中デッキ
  return(
    <div style={{minHeight:"100vh",background:"#0d0d18",
      fontFamily:"'Noto Serif JP',serif",color:"#e8dcc8",
      display:"flex",justifyContent:"center",alignItems:"flex-start",padding:DK?"32px 16px":"16px"}}>
      <div style={{width:"100%",maxWidth:DK?560:420,display:"flex",flexDirection:"column",gap:14}}>

        {/* ヘッダー */}
        <div style={{textAlign:"center",paddingBottom:4}}>
          <div style={{position:"relative",display:"inline-block"}}>
            <div style={{fontSize:DK?40:30,letterSpacing:4,color:"#c9a84c",fontWeight:900,
              borderBottom:"2px solid #c9a84c",paddingBottom:6,display:"inline-block"}}>{T.appLogo}</div>
            <button onClick={onToggleLang}
              style={{position:"absolute",top:-2,right:-52,background:"#1e1e36",
                border:"1px solid #c9a84c",borderRadius:8,padding:"3px 8px",
                fontSize:11,fontWeight:700,color:"#c9a84c",cursor:"pointer",fontFamily:"inherit"}}>
              {T.langToggle}
            </button>
          </div>
          <h1 style={{fontSize:DK?28:22,fontWeight:900,color:"#ece8d8",marginTop:8}}>{T.appTitle}</h1>
        </div>

        {/* ランク・XPバー */}
        {gSt&&rank&&(
          <div style={{background:"#13132a",border:"1px solid #252542",borderRadius:14,padding:"14px 16px"}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <span style={{fontSize:24}}>{rank.icon}</span>
              <div>
                <div style={{fontSize:16,fontWeight:800,color:rank.color}}>{rName(rank,lang)}</div>
                <div style={{fontSize:11,color:"#555"}}>{T.plays(gSt.plays)}</div>
              </div>
              <div style={{marginLeft:"auto",textAlign:"right"}}>
                <div style={{fontSize:11,color:"#666"}}>{T.bestScore}</div>
                <div style={{fontSize:14,fontWeight:700,color:"#c9a84c"}}>{gSt.bestScore}pt</div>
              </div>
            </div>
            <XpBar totalXP={gSt.totalXP} compact/>
          </div>
        )}

        {/* 一発復習 / 新問挑戦 */}
        <div style={{display:"flex",gap:10}}>
          {[
            {label:T.reviewAllDue,sub:reviewCount>0?T.todayDue(reviewCount):T.reviewNone,
             count:reviewCount,icon:"🔁",color:"#22c55e",onClick:onPlayReview},
            {label:T.tryNewCards,sub:newCount>0?T.todayDue(newCount):T.newCardsNone,
             count:newCount,icon:"✨",color:"#c9a84c",onClick:onPlayNew},
          ].map(({label,sub,count,icon,color,onClick})=>(
            <button key={label} onClick={onClick} disabled={count===0}
              style={{flex:1,background:count>0?`rgba(${color==="#22c55e"?"34,197,94":"201,168,76"},0.08)`:"#111120",
                border:`2px solid ${count>0?color:"#2a2a44"}`,
                borderRadius:16,padding:"14px 12px",cursor:count>0?"pointer":"default",
                fontFamily:"inherit",textAlign:"left",transition:"all 0.2s"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <span style={{fontSize:22}}>{icon}</span>
                {count>0&&<div style={{background:color,color:"#0d0d18",
                  borderRadius:20,padding:"2px 9px",fontSize:13,fontWeight:800,marginLeft:"auto"}}>
                  {count}
                </div>}
              </div>
              <div style={{fontSize:DK?15:13,fontWeight:800,
                color:count>0?color:"#555"}}>{label}</div>
              <div style={{fontSize:11,color:count>0?"#888":"#444",marginTop:2}}>{sub}</div>
            </button>
          ))}
        </div>

        {/* デッキ一覧 */}
        <div style={{fontSize:11,color:"#555",letterSpacing:1,paddingLeft:4}}>{T.myDecks}</div>
        {decks.length===0&&(
          <div style={{background:"#13132a",border:"1px solid #252542",borderRadius:14,
            padding:"20px",textAlign:"center",color:"#555",fontSize:13}}>
            {T.noDecks}<br/>
            <span style={{color:"#c9a84c",cursor:"pointer"}} onClick={onManageDecks}>
              {T.addDeckLink}
            </span>
          </div>
        )}
        {/* デッキ選択ダイアログ */}
        {deckDialog&&(
          <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.7)",
            display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,padding:16}}
            onClick={()=>setDeckDialog(null)}>
            <div style={{background:"#13132a",border:"1px solid #2a2a44",borderRadius:18,maxHeight:"calc(100vh - 32px)",overflowY:"auto",
              padding:"22px 20px",width:"100%",maxWidth:360,display:"flex",flexDirection:"column",gap:12}}
              onClick={e=>e.stopPropagation()}>
              <div style={{fontSize:15,fontWeight:800,color:"#ece8d8",marginBottom:4}}>
                📚 {deckDialog.name}
              </div>
              <div style={{fontSize:11,color:"#555",marginBottom:4}}>{deckDialog.questions.length}問</div>
              <button onClick={()=>{setDeckDialog(null);onPlayDeck(deckDialog,false);}}
                style={{background:"#c9a84c",border:"none",borderRadius:12,padding:"14px",
                  fontSize:DK?16:14,fontWeight:800,color:"#0d0d18",cursor:"pointer",
                  fontFamily:"inherit",textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:22}}>▶</span>
                <div>
                  <div>{T.normalPlay}</div>
                  <div style={{fontSize:11,fontWeight:400,opacity:0.7,marginTop:2}}>{T.normalPlaySub}</div>
                </div>
              </button>
              <button onClick={()=>{setDeckDialog(null);onPlayDeck(deckDialog,false,true);}}
                style={{background:"#1e1e36",border:"1px solid #3a6a3a",borderRadius:12,padding:"14px",
                  fontSize:DK?16:14,fontWeight:800,color:"#4ade80",cursor:"pointer",
                  fontFamily:"inherit",textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:22}}>🔀</span>
                <div>
                  <div>{T.randomPlay}</div>
                  <div style={{fontSize:11,fontWeight:400,color:"#888",marginTop:2}}>{T.randomPlaySub}</div>
                </div>
              </button>
              <button onClick={()=>{setDeckDialog(null);onPlayDeck(deckDialog,true);}}
                style={{background:"#1e1e36",border:"1px solid #4a4a7a",borderRadius:12,padding:"14px",
                  fontSize:DK?16:14,fontWeight:800,color:"#ece8d8",cursor:"pointer",
                  fontFamily:"inherit",textAlign:"left",display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:22}}>📖</span>
                <div>
                  <div>{T.previewMode}</div>
                  <div style={{fontSize:11,fontWeight:400,color:"#888",marginTop:2}}>{T.previewModeSub}</div>
                </div>
              </button>
              <button onClick={()=>setDeckDialog(null)}
                style={{background:"none",border:"none",color:"#555",fontSize:13,
                  cursor:"pointer",fontFamily:"inherit",marginTop:2}}>
                {T.cancel}
              </button>
            </div>
          </div>
        )}
        {folderNames.map(folderName=>{
          const folderDecks=folderGroups[folderName];
          const isCollapsed=folderName===''?false:!openFolders.has(folderName);
          const hasFolder=folderName!=='';
          return(
            <div key={folderName||'__none__'}>
              {hasFolder&&(
                <button onClick={()=>toggleFolder(folderName)}
                  style={{display:"flex",alignItems:"center",gap:8,width:"100%",
                    background:"none",border:"none",cursor:"pointer",
                    padding:"6px 4px 4px",fontFamily:"inherit"}}>
                  <span style={{fontSize:11,color:"#4a6a88",fontWeight:700,letterSpacing:0.5}}>
                    {isCollapsed?"▶":"▼"} 📁 {folderName}
                  </span>
                  <span style={{fontSize:10,color:"#444",marginLeft:"auto"}}>
                    {folderDecks.length}
                  </span>
                </button>
              )}
              {!isCollapsed&&folderDecks.map(dk=>{

            </div>

                {T.savedResume}

              <button onClick={onClearSave}
                style={{background:"none",border:"1px solid #333",borderRadius:8,padding:"8px 12px",

        <div style={{display:"flex",gap:8,marginTop:4}}>

            style={{flex:1,background:"#1e1e36",border:"1px solid #333",borderRadius:10,

          </button>

            {T.navStats}

            style={{flex:1,background:"#1e1e36",border:"1px solid #333",borderRadius:10,
              padding:"10px 0",fontSize:12,color:"#aaa",cursor:"pointer",fontFamily:"inherit"}}>
            {T.navData}
          </button>
        </div>

        {/* Support button */}
        <div style={{textAlign:"center",paddingTop:4,paddingBottom:8}}>
          <a href="https://paypal.me/mk7qn" target="_blank" rel="noopener noreferrer"
            style={{display:"inline-block",background:"none",border:"1px solid #2a2a44",
              borderRadius:20,padding:"6px 18px",fontSize:11,color:"#555",

}

/* ══════════════════════════════════════════════════════════════
   APP
