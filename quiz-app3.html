function QuizApp(){
  const[lang,setLang]=useState(()=>localStorage.getItem('econ_lang')||'ja');
  const toggleLang=()=>{
    const nl=lang==='ja'?'en':'ja';
    setLang(nl);localStorage.setItem('econ_lang',nl);
  };
  const T=lang==='en'?T_EN:T_JA;
  const[QS,setQS]=useState(DEFAULT_QS);
  const[typingDone,setTypingDone]=useState(false);
  const[s,dispatch]=useReducer(reducer,makeInit(DEFAULT_QS));
  const{phase,queue,pendingQueue,score,combo,maxCombo,inputs,timeLeft,feedback,
        showHint,wrongCounts,questionKey,answeredCorrectly,attemptedIds,shuffled,firstTryCorrectCount,newPhaseStart,viewedNewCount,newCardIds}=s;
  const refs=useRef([]);
  const ghostingRef=useRef(false); // 自動タイプ中フラグ（FillInlineと共有）
  const[gSt,setGSt]=useState(()=>loadSt());
  const[rankUp,setRankUp]=useState(null);
  const[xpInfo,setXpInfo]=useState(null);
  const[showIO,setShowIO]=useState(false);
  const[showStats,setShowStats]=useState(false);
  const[showQManage,setShowQManage]=useState(false);
  const[savedGame,setSavedGame]=useState(()=>loadGame());
  const[syncUrl,setSyncUrl]=useState(()=>localStorage.getItem(SYNC_URL_KEY)||"");

  // アニメーション用ステート
  const[correctAnim,setCorrectAnim]=useState(false);
  const[wrongAnim,setWrongAnim]=useState(false);
  const[comboAnim,setComboAnim]=useState(null);
  const[timerEdge,setTimerEdge]=useState(false);
  const[rankBurst,setRankBurst]=useState(null);
  const feedbackReadyKeyRef=useRef(-1); // ゴーストタップ防止（ref で常に最新値）

  /* ── NextDNS 報酬タイマー ── */
  const[ndConfig,setNdConfig]=useState(()=>{try{return JSON.parse(localStorage.getItem('nd_config'))||null;}catch{return null;}});
  const[showNdSettings,setShowNdSettings]=useState(false);
  const[ndApiKey,setNdApiKey]=useState('');
  const[ndProfileId,setNdProfileId]=useState('');
  const[rewardActive,setRewardActive]=useState(false);
  const[rewardSecs,setRewardSecs]=useState(300);
  const[rewardStatus,setRewardStatus]=useState('');
  const rewardTimerRef=useRef(null);
  const prevCorrectLenRef=useRef(0);
  const prevAttemptedLenRef=useRef(0);   // 新問試行カウント用
  const ND_DOMAINS=['twitter.com','x.com','t.co','abs.twimg.com'];
  const ND_MINUTES=5;
  // 報酬発火（=自動中断）用：正解 or 新問試行が合計 AUTO_PAUSE_REQUIRED 回でホームへ
  const AUTO_PAUSE_REQUIRED=10;
  const autoPauseCounterRef=useRef(0);
  const autoPauseTimerRef=useRef(null);  // setTimeout のキャンセル用
  const doPauseRef=useRef(()=>{});

  useEffect(()=>{
    const curr=answeredCorrectly.length;
    const prev=prevCorrectLenRef.current;
    // lengthが減った=新ゲーム開始。refだけ更新してカウントしない
    if(curr<prev){prevCorrectLenRef.current=curr;return;}
    if(curr>prev){
      const added=curr-prev;
      const oldTotal=parseInt(localStorage.getItem('nd_total_correct')||'0');
      const newTotal=oldTotal+added;
      localStorage.setItem('nd_total_correct',String(newTotal));
      const cfg=JSON.parse(localStorage.getItem('nd_config')||'null');
      if(cfg?.apiKey&&cfg?.profileId&&Math.floor(newTotal/15)>Math.floor(oldTotal/15)) triggerReward(cfg);

      // 5問正解ごとに自動でゲームを保存してホームへ戻す（報酬タイム）
      autoPauseCounterRef.current+=added;
      if(autoPauseCounterRef.current>=AUTO_PAUSE_REQUIRED){
        autoPauseCounterRef.current=0;
        // フィードバック表示後に中断（即時だと正解演出が飛ぶため少し待つ）
        if(autoPauseTimerRef.current)clearTimeout(autoPauseTimerRef.current);
        autoPauseTimerRef.current=setTimeout(()=>{autoPauseTimerRef.current=null;doPauseRef.current();},900);
      }
    }
    prevCorrectLenRef.current=curr;
  },[answeredCorrectly.length]);

  // 新問試行（正解・不正解問わず初回アタック）の監視
  useEffect(()=>{
    const curr=attemptedIds.length;
    const prev=prevAttemptedLenRef.current;
    if(curr<prev){prevAttemptedLenRef.current=curr;return;} // 新ゲーム開始時リセット
    if(curr>prev){
      const added=curr-prev;
      // newCardIds に含まれる ID だけが「新問試行」
      const newAttempts=added; // 実際には dispatch SUBMIT 後に増えるので 1 ずつ増加
      // nd_attempt_count を更新（Swift 側の監視対象）
      const oldAttempt=parseInt(localStorage.getItem('nd_attempt_count')||'0');
      // 今回増えた attemptedIds のうち newCardIds に含まれるものだけカウント
      // attemptedIds 自体には新問以外も混在するため newCardIds との積を取る
      // ここでは直前のフレームで増えた分を検出するためシンプルに差分を見る
      // （newCardIds との照合は HTML state を直接参照）
      const newOnlyAdded=[...Array(added)].reduce((_,__,i)=>{
        const id=attemptedIds[prev+i];
        return _+(Array.isArray(newCardIds)&&newCardIds.includes(id)?1:0);
      },0);
      if(newOnlyAdded>0){
        const newAttemptTotal=oldAttempt+newOnlyAdded;
        localStorage.setItem('nd_attempt_count',String(newAttemptTotal));
        // 自動中断カウンタにも加算
        autoPauseCounterRef.current+=newOnlyAdded;
        if(autoPauseCounterRef.current>=AUTO_PAUSE_REQUIRED){
          autoPauseCounterRef.current=0;
          if(autoPauseTimerRef.current)clearTimeout(autoPauseTimerRef.current);
          autoPauseTimerRef.current=setTimeout(()=>{autoPauseTimerRef.current=null;doPauseRef.current();},900);
        }
      }
    }
    prevAttemptedLenRef.current=curr;
  },[attemptedIds.length]);

  const ND_WORKER_URL='https://nd-timer.stringhs05.workers.dev';

  const ndPCUnlock=async(cfg)=>{
    await fetch(`${ND_WORKER_URL}/start`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({apiKey:cfg.apiKey,profileId:cfg.profileId,minutes:ND_MINUTES})
    });
  };
  const ndPCLock=async(_cfg)=>{
    // 再ブロックはWorker側のアラームが自動で行うため何もしない
  };

  // タイマー開始（残り秒数を受け取る共通関数）
  const startRewardTimer=(cfg,secs)=>{
    if(rewardTimerRef.current){clearInterval(rewardTimerRef.current);rewardTimerRef.current=null;}
    setRewardActive(true);
    setRewardSecs(secs);
    setRewardStatus('active');
    let remaining=secs;
    rewardTimerRef.current=setInterval(async()=>{
      remaining--;
      setRewardSecs(remaining);
      if(remaining<=0){
        clearInterval(rewardTimerRef.current);rewardTimerRef.current=null;
        localStorage.removeItem('nd_reward_until');
        setRewardStatus('relocking');
        try{await ndPCLock(cfg);}catch(e){}
        setRewardActive(false);setRewardStatus('');
      }
    },1000);
  };

  // 新規報酬：APIで解除してタイマー開始
  const triggerReward=async(cfg)=>{
    setRewardActive(true);
    setRewardSecs(ND_MINUTES*60);
    setRewardStatus('unlocking');
    try{
      await ndPCUnlock(cfg);
    }catch(e){
      setRewardStatus('error');
      return;
    }
    const until=Date.now()+ND_MINUTES*60*1000;
    localStorage.setItem('nd_reward_until',String(until));
    startRewardTimer(cfg,ND_MINUTES*60);
  };

  // 正解フィードバック時にSRS・成績を即座に保存（中断対策）
  const lastSavedSRSRef=useRef({});
  useEffect(()=>{
    if(phase==='feedback'&&feedback?.qId&&!feedback?.isNewCard){
      const qId=feedback.qId;
      const isCorrect=!!feedback.correct;
      const wc=wrongCounts[qId]||0;

      // SRS即保存（正解時のみ）
      if(isCorrect&&!lastSavedSRSRef.current[qId]){
        lastSavedSRSRef.current[qId]=true;
        setSRS(prevSRS=>{
          const updated=updateSRS(prevSRS,qId,true);
          saveSRS(updated);
          return updated;
        });
      }

      // 履歴を保存
      const histResult=isCorrect?(wc===0?'first':'retry'):'wrong';
      saveQuestionHistory(qId,histResult,wc);

      // 成績即保存（正解・不正解ともに）
      setGSt(prevGSt=>{
        if(!prevGSt) return prevGSt;
        const prevQS=prevGSt.questionStats||{};
        const prev=prevQS[qId]||{sessions:0,firstTry:0,retryOk:0,wrong:0};
        // wrongCountは今回の不正解数のみ（前回分と重複しないよう差分で計算）
        const savedWrong=prev._savedWrong||0;
        const newWrong=Math.max(0,wc-savedWrong);
        const isFirstTry=isCorrect&&wc===0&&prev.sessions===prev._savedSessions;
        const isRetryOk=isCorrect&&wc>0&&prev.sessions===prev._savedSessions;
        const newQS={
          ...prevQS,
          [qId]:{
            sessions: prev.sessions+(isCorrect?1:0),
            firstTry: prev.firstTry+(isFirstTry?1:0),
            retryOk:  prev.retryOk+(isRetryOk?1:0),
            wrong:    prev.wrong+newWrong,
            _savedWrong: wc,
            _savedSessions: prev.sessions+(isCorrect?1:0),
          }
        };
        const newSt={...prevGSt,questionStats:newQS};
        saveSt(newSt);
        return newSt;
      });
    }
    if(phase==='start'){
      lastSavedSRSRef.current={};
    }
  },[phase,feedback?.qId,feedback?.correct]);

  const checkAndRestoreReward=()=>{
    const until=parseInt(localStorage.getItem('nd_reward_until')||'0');
    const cfg=JSON.parse(localStorage.getItem('nd_config')||'null');
    if(!cfg?.apiKey||!cfg?.profileId) return;
    if(!until){
      // nd_reward_untilがない = 正常状態。何もしない
      return;
    }
    const remaining=Math.floor((until-Date.now())/1000);
    if(remaining>0){
      // まだ開放中 → タイマーが動いていなければ再開
      if(!rewardTimerRef.current) startRewardTimer(cfg,remaining);
    } else {
      // 期限切れ → 再ブロック
      localStorage.removeItem('nd_reward_until');
      setRewardActive(false);setRewardStatus('relocking');
      ndPCLock(cfg).catch(()=>{}).finally(()=>setRewardStatus(''));
    }
  };

  useEffect(()=>{
    checkAndRestoreReward();
    const onVisible=()=>{if(document.visibilityState==='visible') checkAndRestoreReward();};
    document.addEventListener('visibilitychange',onVisible);
    return ()=>document.removeEventListener('visibilitychange',onVisible);
  },[]);

  const saveNdConfig=()=>{
    const cfg={apiKey:ndApiKey.trim(),profileId:ndProfileId.trim()};
    localStorage.setItem('nd_config',JSON.stringify(cfg));
    setNdConfig(cfg);setShowNdSettings(false);
  };
  const fmtSecs=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  const[feedbackReadyKey,setFeedbackReadyKey]=useState(-1);
  // デッキ・SRS
  const[decks,setDecks]=useState([]);
  const[dbReady,setDbReady]=useState(false);
  useEffect(()=>{
    loadDecksAsync().then(loaded=>{
      setDecks(loaded);
      setDbReady(true);
    });
  },[]);
  const[srs,setSRS]=useState(()=>loadSRS());
  const[showDeckMgr,setShowDeckMgr]=useState(false);
  const[isToday,setIsToday]=useState(false); // 今日のデッキモード

  const MAX_SCORE=QS.reduce((a,q)=>a+q.pts,0);

  // ロビーへ戻る
  const goLobby=()=>{
    BGM.stop();VBGM.stop();
    dispatch({type:"BACK",QS});
  };
  // デッキを選んでプレイ
  const playDeck=(dk,introMode=false,randomMode=false)=>{
    const freshSRS=loadSRS();
    // introMode=true のときはデッキ全問を自動入力対象にする（SRSデータの有無に関わらず）
    // introMode=false のときは自動入力なし
    const newIds=introMode ? dk.questions.map(q=>q.id) : [];
    const qs=randomMode ? shuffle([...dk.questions]) : dk.questions;
    setQS(qs);
    setIsToday(false);
    setRankUp(null);setXpInfo(null);
    clearGame();setSavedGame(null);
    try{getCtx().resume().catch(()=>{});}catch(_){}
    SFX.start();
    dispatch({type:"START",QS:qs,newCardIds:newIds});
  };
  // 一発復習
  const playReview=()=>{
    const freshSRS=loadSRS();
    const qStats=gSt?.questionStats||{};
    const cards=buildReviewDeck(decks,freshSRS,15,qStats);
    if(cards.length===0)return;
    setSRS(freshSRS);setQS(cards);setIsToday(true);
    setRankUp(null);setXpInfo(null);clearGame();setSavedGame(null);
    try{getCtx().resume().catch(()=>{});}catch(_){}
    SFX.start();
    dispatch({type:"START",QS:cards,pendingStart:cards.length,newCardIds:[]});
  };
  // 新問挑戦
  const playNew=()=>{
    const freshSRS=loadSRS();
    const cards=buildNewDeck(decks,freshSRS);
    if(cards.length===0)return;
    setSRS(freshSRS);setQS(cards);setIsToday(true);
    setRankUp(null);setXpInfo(null);clearGame();setSavedGame(null);
    try{getCtx().resume().catch(()=>{});}catch(_){}
    SFX.start();
    dispatch({type:"START",QS:cards,newCardIds:[]});
  };

  // 今日のデッキをプレイ
  const playToday=()=>{
    const freshSRS=loadSRS();
    const{review,newCards}=buildTodaysDeck(decks,freshSRS);
    const qStats=gSt?.questionStats||{};
    const isHard=q=>(qStats[q.id]?.wrong||0)>=7;
    const hardWrong=shuffle(review.filter(q=>isHard(q)));
    const lapsed   =shuffle(review.filter(q=>!isHard(q)&&(freshSRS[q.id]?.lapses||0)>0));
    const noLapses =shuffle(review.filter(q=>!isHard(q)&&(freshSRS[q.id]?.lapses||0)===0));
    const combined=[...hardWrong,...lapsed,...noLapses,...shuffle(newCards)];
    if(combined.length===0)return;
    setSRS(freshSRS);
    setQS(combined);
    setIsToday(true);
    setRankUp(null);setXpInfo(null);
    clearGame();setSavedGame(null);
    try{getCtx().resume().catch(()=>{});}catch(_){}
    SFX.start();
    const reviewCount=hardWrong.length+lapsed.length+noLapses.length;
    // 今日のデッキでは新カードも通常モードで出題（自動入力なし）
    dispatch({type:"START",QS:combined,pendingStart:reviewCount||combined.length,newCardIds:[]});
  };

  /* 完了時：XP + 問題別成績を保存 */
  useEffect(()=>{
    if(phase!=="complete"||!gSt)return;
    const ftc=firstTryCorrectCount,perfect=ftc===QS.length;
    const earned=calcXP({score,ftc,combo:maxCombo,perfect});
    setXpInfo({earned,scoreXP:score*3,ftcXP:ftc*2,comboXP:Math.min(maxCombo,10),perfectXP:perfect?30:0,ftc,perfect});

    // 問題別成績を更新
    const prevQS=gSt.questionStats||{};
    const newQS={...prevQS};
    // questionStatsは即保存済みなのでここでは更新不要
    // _savedWrongと_savedSessionsの一時キーをクリーンアップ
    const cleanQS={};
    Object.entries(gSt.questionStats||{}).forEach(([id,v])=>{
      const{_savedWrong,_savedSessions,...rest}=v;
      cleanQS[id]=rest;
    });

    const oldRank=getRank(gSt.totalXP),newXP=gSt.totalXP+earned,newRank=getRank(newXP);
    const newSt={
      totalXP:newXP,plays:gSt.plays+1,
      bestScore:Math.max(gSt.bestScore,score),bestCombo:Math.max(gSt.bestCombo,maxCombo),
      history:[...gSt.history.slice(-9),{score,xp:earned,
        date:new Date().toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"})}],
      questionStats:cleanQS,
    };
    setGSt(newSt);saveSt(newSt);
    clearGame();setSavedGame(null);

    // SRS更新
    // セッション完了時：正解済み問題はfeedback時に既にSRS保存済みなので
    // ここではミスのみ対応（pauseのみ）
    let newSRS={...srs};
    QS.forEach(q=>{
      const wc=wrongCounts[q.id]||0;
      const wasAnswered=answeredCorrectly.includes(q.id);
      if(!wasAnswered&&wc>0){
        // 最後まで正解できなかった → 10分後に再出題
        newSRS=updateSRSPause(newSRS,q.id);
      }
      // 正解済みはfeedback時に既に保存済みなのでスキップ
    });
    setSRS(newSRS);saveSRS(newSRS);
    if(newRank.name!==oldRank.name){
      setRankUp({from:oldRank,to:newRank});
      setTimeout(SFX.rankUp,900);
      // ランクバーストアニメ
      setTimeout(()=>{setRankBurst(newRank);setTimeout(()=>setRankBurst(null),1200);},800);
    }
    // 新規カードのみのデッキ（Previewモード）は勝利音
    const allNew=Array.isArray(newCardIds)&&newCardIds.length>0&&QS.every(q=>newCardIds.includes(q.id));
    const previewDone=(viewedNewCount||0)>=QS.length&&QS.length>0&&allNew;
    setTimeout(()=>(allNew||previewDone||score>=MAX_SCORE*0.7)?SFX.win():SFX.lose(),500);
  },[phase]);

  const q=phase==="feedback"&&feedback?QS.find(qq=>qq.id===feedback.qId):(queue.length>0?QS[queue[0]]:null);
  const dq=q&&shuffled&&q.type==="mc"?{...q,...shuffled}:q;
  const wrongCount=q?(wrongCounts[q.id]||0):0;
  const isFB=phase==="feedback";
  const isNew=q&&Array.isArray(newCardIds)?newCardIds.includes(q.id):false;
  const maxT=qTimer(q||QS[0]);
  const timerPct=typingDone?Math.min(100,timeLeft/maxT*100):100;
  const timerColor=!typingDone?"#3a3a58":timeLeft<=5?"#ef4444":timeLeft<=10?"#f97316":"#c9a84c";

  // reset typingDone on each new question
  useEffect(()=>{setTypingDone(false);},[questionKey]);
  useEffect(()=>{
    if(phase!=="question"||!typingDone)return;
    const id=setInterval(()=>dispatch({type:"TICK"}),1000);
    return()=>clearInterval(id);
  },[questionKey,typingDone]);
  useEffect(()=>{
    if(phase!=="question")return;
    if(timeLeft<=5&&timeLeft>0){SFX.tick();setTimerEdge(true);}
    else setTimerEdge(false);
    if(timeLeft===0)dispatch({type:"SUBMIT",correct:false,blankResults:null,QS});
  },[timeLeft]);
  useEffect(()=>{
    if(phase!=="feedback"||!feedback)return;
    // ゴーストタップ防止：600ms後にquestionKeyを登録
    feedbackReadyKeyRef.current=-1;
    const tid=setTimeout(()=>{feedbackReadyKeyRef.current=questionKey;setFeedbackReadyKey(questionKey);},600);
    if(isNew){
      SFX.newCard();
      return()=>clearTimeout(tid);
    }
    if(feedback.correct){
      SFX.correct();
      Hap.impact("Light");
      setTimeout(()=>Hap.impact("Light"),150);
      setTimeout(()=>Hap.impact("Medium"),300);
      setTimeout(()=>Hap.impact("Medium"),450);
      setTimeout(()=>Hap.impact("Heavy"),620);
      setCorrectAnim(true);
      setTimeout(()=>setCorrectAnim(false),700);
      if(combo===3){setTimeout(SFX.combo3,320);setComboAnim(combo);setTimeout(()=>setComboAnim(null),900);setTimeout(()=>Hap.impact("Heavy"),320);}
      else if(combo===5||combo===10){setTimeout(SFX.combo5,320);setComboAnim(combo);setTimeout(()=>setComboAnim(null),900);setTimeout(()=>Hap.impact("Heavy"),320);}
    }else{
      SFX.wrong();
      Hap.notification("Error");
      setWrongAnim(true);
      setTimeout(()=>setWrongAnim(false),500);
    }
  },[phase,feedback]);
  // 自動進行なし：全フィードバック画面でユーザー操作待ち
  useEffect(()=>{
    if(phase==="question"||phase==="feedback")BGM.start();
    else BGM.stop();
    if(phase==="complete") VBGM.start();
    else VBGM.stop();
  },[phase]);
  useEffect(()=>()=>{BGM.stop();VBGM.stop();},[]);


  // 新カードフェーズ開始通知を自動消去
  useEffect(()=>{
    if(!newPhaseStart)return;
    const id=setTimeout(()=>dispatch({type:"CLEAR_NEW_PHASE",QS}),2200);
    return()=>clearTimeout(id);
  },[newPhaseStart]);
  useEffect(()=>{
    if(phase!=="question"&&phase!=="feedback")return;
    const seen=(answeredCorrectly.length||0)+(viewedNewCount||0);
    const ratio=QS.length>0?seen/QS.length:0;
    const lv=ratio>=0.75?3:ratio>=0.5?2:ratio>=0.25?1:0;
    BGM.setLevel(lv);
  },[questionKey,answeredCorrectly.length,viewedNewCount]);
  // フィードバック画面でEnterキー → 次へ（question中は別ハンドラが担当）
  useEffect(()=>{
    if(phase!=="feedback"||!isFB||!feedback)return;
    const handler=(e)=>{
      if(e.key!=="Enter"||e.isComposing||e.keyCode===229)return;
      e.preventDefault(); // prevent focused button (e.g. ⏸) from activating
      if(feedbackReadyKeyRef.current===questionKey) dispatch({type:"NEXT",QS});
    };
    window.addEventListener("keydown",handler);
    return()=>window.removeEventListener("keydown",handler);
  },[phase,isFB,feedback]);
  // 穴埋め問題中、どの空欄にもフォーカスしていない時にEnterで1つ目にフォーカス
  useEffect(()=>{
    if(phase!=="question"||isFB||q?.type!=="fill")return;
    const handler=(e)=>{
      if(e.key!=="Enter")return;
      if(e.isComposing||e.keyCode===229)return; // IME変換中は無視
      if(ghostingRef.current)return; // 自動タイプ中はEnter無効
      const focused=refs.current.some(r=>r&&r===document.activeElement);
      e.preventDefault(); // prevent focused button from activating while in question phase
      if(!focused&&refs.current[0]){
        refs.current[0].focus();
      }
    };
    window.addEventListener("keydown",handler);
    return()=>window.removeEventListener("keydown",handler);
  },[phase,isFB,questionKey]);
  // 新規カード・MC：3秒後に自動で正解を送信
  useEffect(()=>{
    if(!isNew||isFB||q?.type!=="mc"||phase!=="question")return;
    const id=setTimeout(()=>submitMC(dq.ans),3000);
    return()=>clearTimeout(id);
  },[questionKey,isNew,phase]);

  const submitFill=()=>{
    if(phase!=="question"||!q)return;
    const r=chkFill(q.blanks,inputs);
    dispatch({type:"SUBMIT",correct:r.every(Boolean),blankResults:r,QS});
  };
  const submitMC=(idx)=>{
    if(phase!=="question"||!dq)return;
    dispatch({type:"SUBMIT",correct:idx===dq.ans,blankResults:null,QS});
  };
  const doStart=()=>{
    try{getCtx().resume().catch(()=>{});}catch(_){}
    SFX.start();Hap.impact("Medium");setRankUp(null);setXpInfo(null);
    clearGame();setSavedGame(null);
    if(autoPauseTimerRef.current){clearTimeout(autoPauseTimerRef.current);autoPauseTimerRef.current=null;}
    autoPauseCounterRef.current=0;
    prevCorrectLenRef.current=0;
    prevAttemptedLenRef.current=0;
    dispatch({type:"START",QS});
  };
  const doResume=()=>{
    if(!savedGame)return;
    try{getCtx().resume().catch(()=>{});}catch(_){}
    SFX.start();setRankUp(null);setXpInfo(null);
    // 進行中の自動中断タイマーをキャンセル
    if(autoPauseTimerRef.current){clearTimeout(autoPauseTimerRef.current);autoPauseTimerRef.current=null;}
    autoPauseCounterRef.current=0;
    // prev系refをセーブデータの現在値に合わせる（useEffectの誤発火防止）
    prevCorrectLenRef.current=savedGame.state.answeredCorrectly?.length||0;
    prevAttemptedLenRef.current=savedGame.state.attemptedIds?.length||0;
    setQS(savedGame.QS);
    dispatch({type:"RESUME",state:savedGame.state,QS:savedGame.QS});
  };
  const doPause=()=>{
    // 中断時：それまでの回答をSRS・成績に即時保存
    if(gSt){
      // 問題別成績を更新
      const prevQS=gSt.questionStats||{};
      const newQStat={...prevQS};
      QS.forEach(q=>{
        const wasAnswered=answeredCorrectly.includes(q.id);
        const wc=wrongCounts[q.id]||0;
        if(!wasAnswered&&wc===0)return; // 未回答は除外
        const prev=prevQS[q.id]||{sessions:0,firstTry:0,retryOk:0,wrong:0};
        const isFirstTry=wasAnswered&&wc===0;
        const isRetryOk=wasAnswered&&wc>0;
        newQStat[q.id]={
          sessions: prev.sessions+(wasAnswered?1:0),
          firstTry: prev.firstTry+(isFirstTry?1:0),
          retryOk:  prev.retryOk+(isRetryOk?1:0),
          wrong:    prev.wrong+wc,
        };
      });
      const newSt={...gSt,questionStats:newQStat};
      setGSt(newSt);saveSt(newSt);

      // SRS更新
      let newSRS={...srs};
      QS.forEach(q=>{
        const wc=wrongCounts[q.id]||0;
        if(answeredCorrectly.includes(q.id)){
          newSRS=updateSRS(newSRS,q.id,wc===0);
        }else if(wc>0){
          // 間違えたが未正解で中断 → 今日再出題
          newSRS=updateSRSPause(newSRS,q.id);
        }
      });
      setSRS(newSRS);saveSRS(newSRS);
    }
    saveGame(s,QS);
    setSavedGame(loadGame());
    if(autoPauseTimerRef.current){clearTimeout(autoPauseTimerRef.current);autoPauseTimerRef.current=null;}
    autoPauseCounterRef.current=0;
    prevCorrectLenRef.current=0;
    prevAttemptedLenRef.current=0;
    dispatch({type:"BACK",QS});
  };
  // 最新の doPause を ref に保持（増分監視 useEffect から呼ぶため）
  doPauseRef.current=doPause;

  /* ── ロビー画面 ─────────────────────────────────────────────── */
  if(phase==="start"){
    if(!dbReady) return(
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",
        height:"100vh",background:"#0d0d18",flexDirection:"column",gap:12}}>
        <div style={{width:32,height:32,border:"3px solid #2a2a42",
          borderTop:"3px solid #c9a84c",borderRadius:"50%",
          animation:"spin 0.8s linear infinite"}}/>
        <div style={{color:"#555",fontSize:13}}>データを読み込み中…</div>
      </div>
    );
    return(
      <LangCtx.Provider value={lang}>
      <div>
        {/* NextDNS 報酬オーバーレイ */}
        {(rewardActive||rewardStatus==='error')&&<RewardOverlay rewardStatus={rewardStatus} rewardSecs={rewardSecs} fmtSecs={fmtSecs} onClose={()=>{setRewardActive(false);setRewardStatus('');}}/>}
        {/* NextDNS 設定モーダル */}
        {showNdSettings&&<NdSettingsModal
          initKey={ndConfig?.apiKey||''} initId={ndConfig?.profileId||''}
          onClose={()=>setShowNdSettings(false)}
          onSave={(k,p)=>{const cfg={apiKey:k,profileId:p};localStorage.setItem('nd_config',JSON.stringify(cfg));setNdConfig(cfg);setShowNdSettings(false);}}
        />}
        {showDeckMgr&&<DeckManagerPanel decks={decks} setDecks={setDecks} QS={QS}
          onClose={()=>setShowDeckMgr(false)}/>}
        {showStats&&<StatsPanel QS={QS} gSt={gSt} onClose={()=>setShowStats(false)}/>}
        {showIO&&<IOPanel QS={QS} setQS={setQS} gSt={gSt} setGSt={setGSt}
          decks={decks} setDecks={setDecks} srs={srs} setSRS={setSRS}
          syncUrl={syncUrl} setSyncUrl={setSyncUrl}
          onClose={()=>setShowIO(false)}/>}
        {showQManage&&<QManagePanel QS={QS} setQS={setQS} onClose={()=>setShowQManage(false)}/>}
        {/* 🐦 設定ボタン（ロビー固定） */}
        <button onClick={()=>setShowNdSettings(true)} title="報酬タイマー設定" style={{position:'fixed',bottom:20,right:20,zIndex:9000,background:ndConfig?'rgba(29,161,242,0.18)':'rgba(40,40,70,0.9)',border:`1px solid ${ndConfig?'rgba(29,161,242,0.5)':'#2a2a42'}`,borderRadius:12,padding:'8px 11px',cursor:'pointer',fontSize:16,lineHeight:1}}>
          🐦
        </button>
        <Lobby
          decks={decks} srs={srs} gSt={gSt}
          onPlayDeck={playDeck}
          onPlayToday={playToday} onPlayReview={playReview} onPlayNew={playNew}
          onManageDecks={()=>setShowDeckMgr(true)}
          onSettings={(t)=>{
            if(t==="stats") setShowStats(true);
            if(t==="io") setShowIO(true);
          }}
          savedGame={savedGame}
          onResume={doResume}
          onClearSave={()=>{clearGame();setSavedGame(null);}}
          lang={lang} onToggleLang={toggleLang}
        />
      </div>
      </LangCtx.Provider>
    );
  }

  /* ── 完了画面 ─────────────────────────────────────────────── */
  if(phase==="complete"){
    const newRankObj=gSt?getRank(gSt.totalXP):null;
    const isBest=gSt&&score>0&&score===gSt.bestScore&&gSt.plays>1;
    return(
      <LangCtx.Provider value={lang}>
      <div style={S.root}>
        <div style={S.center}>
          <div style={{...S.card,gap:12,maxWidth:400}}>
            <div style={{fontSize:40,animation:"bounceIn 0.6s ease"}}>
              {score/MAX_SCORE>=0.9?"🏆":score/MAX_SCORE>=0.7?"⚔️":score/MAX_SCORE>=0.5?"🌾":"🗾"}
            </div>
            <div style={{display:"flex",alignItems:"baseline",gap:4}}>
              <span style={{fontSize:50,fontWeight:900,color:scoreColor(score)}}>{score}</span>
              <span style={{fontSize:17,color:"#555",alignSelf:"flex-end",marginBottom:7}}>{T.ptsSuffix(MAX_SCORE)}</span>
            </div>
            <div style={S.statsRow}>
              <div style={S.stat}><div style={{...S.statN,color:scoreColor(score)}}>{answeredCorrectly.length}/{QS.length}</div><div style={S.statL}>{T.correctStat}</div></div>
              <div style={S.stat}><div style={S.statN}>{xpInfo?.ftc||0}/{QS.length}</div><div style={S.statL}>{T.firstTryStat}</div></div>
              <div style={S.stat}><div style={{...S.statN,color:"#f97316"}}>{maxCombo}</div><div style={S.statL}>{T.maxComboStat}</div></div>
            </div>
            {xpInfo&&(
              <div style={{width:"100%",background:"#0d0d20",borderRadius:12,padding:"12px 14px"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
                  <span style={{fontSize:12,color:"#aaa"}}>{T.xpEarned}</span>
                  <span style={{fontSize:16,fontWeight:800,color:"#c9a84c"}}>+{xpInfo.earned} XP</span>
                </div>
                {[
                  [T.xpScore(score),xpInfo.scoreXP],
                  [T.xpFirst(xpInfo.ftc),xpInfo.ftcXP],
                  [T.xpCombo,xpInfo.comboXP],
                  xpInfo.perfect?[T.xpPerfect,xpInfo.perfectXP]:null,
                ].filter(Boolean).map(([label,val])=>(
                  <div key={label} style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#555",marginBottom:3}}>
                    <span>{label}</span><span style={{color:"#777"}}>+{val}</span>
                  </div>
                ))}
                <div style={{borderTop:"1px solid #2a2a3a",marginTop:10,paddingTop:10}}>
                  {gSt&&<XpBar totalXP={gSt.totalXP}/>}
                </div>
              </div>
            )}
            {isBest&&<div style={{background:"rgba(240,192,64,0.1)",border:"1px solid #f0c040",
              borderRadius:10,padding:"7px 14px",fontSize:12,color:"#f0c040",animation:"bounceIn 0.5s ease"}}>
              {T.newBest}
            </div>}
            {isToday&&xpInfo&&(
              <div style={{background:"rgba(34,197,94,0.08)",border:"1px solid #22c55e",
                borderRadius:10,padding:"8px 14px",fontSize:12,color:"#4ade80",textAlign:"center"}}>
                {T.todayDone2}
              </div>
            )}
            {rankUp&&(
              <div style={{width:"100%",background:"rgba(255,255,255,0.03)",
                border:`2px solid ${rankUp.to.color}`,borderRadius:14,
                padding:"12px",textAlign:"center",animation:"rankUpAnim 0.6s ease"}}>
                <div style={{fontSize:10,letterSpacing:3,color:"#aaa",marginBottom:6}}>{T.rankUpLabel}</div>
                <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
                  <span style={{fontSize:13,color:rankUp.from.color}}>{rankUp.from.icon} {rName(rankUp.from,lang)}</span>
                  <span style={{color:"#555",fontSize:16}}>→</span>
                  <span style={{fontSize:17,fontWeight:800,color:rankUp.to.color}}>{rankUp.to.icon} {rName(rankUp.to,lang)}</span>
                </div>
              </div>
            )}
            {newRankObj&&<div style={{fontSize:11,color:"#555"}}>
              {T.currentRank}<span style={{color:newRankObj.color,fontWeight:700}}>{newRankObj.icon} {rName(newRankObj,lang)}</span>
            </div>}
            <div style={{display:"flex",gap:8,width:"100%"}}>
              <button style={{...S.btnG,flex:1}} onClick={doStart}>{T.playAgain}</button>
              <button onClick={goLobby}
                style={{background:"none",border:"1px solid #2a2a44",color:"#888",
                  borderRadius:12,padding:"12px 16px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>🏠</button>
            </div>
          </div>
        </div>
      </div>
      </LangCtx.Provider>
    );
  }

  if(!q||!dq)return null;

  /* ── 問題画面 ─────────────────────────────────────────────── */
  return(
    <LangCtx.Provider value={lang}>
    <div style={S.root}>
      {/* 既存フィードバックフラッシュ */}
      {isFB&&<div className="flashFade" style={{...S.flashOverlay,
        background:isNew?"rgba(201,168,76,0.12)":feedback?.correct?"rgba(34,197,94,0.18)":"rgba(239,68,68,0.42)",
        animationDuration:"1.9s"}}/>}
      {/* 新カードフェーズ開始通知 */}
      {newPhaseStart&&(
        <div style={{position:"fixed",top:"30%",left:0,right:0,
          display:"flex",justifyContent:"center",pointerEvents:"none",zIndex:80,
          animation:"slideUp 0.5s ease"}}>
          <div style={{background:"rgba(96,165,250,0.18)",border:"1px solid #60a5fa",
            borderRadius:14,padding:"12px 28px",textAlign:"center"}}>
            <div style={{fontSize:DK?18:15,fontWeight:800,color:"#60a5fa"}}>🆕 新しい問題</div>
            <div style={{fontSize:DK?13:11,color:"#888",marginTop:3}}>{T.nextPhase}</div>
          </div>
        </div>
      )}
      {correctAnim&&(
        <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",
          justifyContent:"center",pointerEvents:"none",zIndex:60}}>
          <div style={{width:150,height:150,borderRadius:"50%",
            border:"5px solid #4ade80",
            animation:"correctRing 0.65s ease-out forwards"}}/>
        </div>
      )}
      {/* NextDNS 報酬オーバーレイ（ゲーム中） */}
      {(rewardActive||rewardStatus==='error')&&<RewardOverlay rewardStatus={rewardStatus} rewardSecs={rewardSecs} fmtSecs={fmtSecs} onClose={()=>{setRewardActive(false);setRewardStatus('');}}/>}
      {/* 不正解：画面縁が赤く光る */}
      {wrongAnim&&(
        <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:60,
          boxShadow:"inset 0 0 70px rgba(239,68,68,0.75)",
          animation:"wrongFlash 0.5s ease forwards"}}/>
      )}
      {/* コンボ：数字が上に飛ぶ */}
      {comboAnim&&(
        <div style={{position:"fixed",top:"38%",left:0,right:0,textAlign:"center",
          pointerEvents:"none",zIndex:60,
          fontSize:DK?56:42,fontWeight:900,color:"#f97316",
          fontFamily:"'Noto Serif JP',serif",
          animation:"comboFloat 0.95s ease-out forwards"}}>
          🔥×{comboAnim}
        </div>
      )}
      {/* タイマー残り5秒：画面縁が赤くパルス */}
      {timerEdge&&(
        <div style={{position:"fixed",inset:0,pointerEvents:"none",zIndex:55,
          animation:"edgePulse 0.5s ease infinite"}}/>
      )}
      {/* ランク昇格：アイコンが大きく出てフェード */}
      {rankBurst&&(
        <div style={{position:"fixed",inset:0,display:"flex",alignItems:"center",
          justifyContent:"center",pointerEvents:"none",zIndex:70}}>
          <div style={{fontSize:110,animation:"rankBurst 1.2s ease-out forwards"}}>
            {rankBurst.icon}
          </div>
        </div>
      )}
      <div style={S.top}>
        <DotMap QS={QS} queue={queue} pendingQueue={pendingQueue} answeredCorrectly={answeredCorrectly}
          attemptedIds={attemptedIds} wrongCounts={wrongCounts} phase={phase}/>
        <div style={S.topRow}>
          <span style={S.qnum}>✓{answeredCorrectly.length}<span style={{color:"#444",fontSize:10}}>/{QS.length}</span></span>
          {combo>0&&<span className="comboPop" style={S.comboTag}>{"🔥".repeat(Math.min(combo,5))} ×{combo}</span>}
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={S.scorePill}>{score}<span style={{color:"#444",fontSize:10}}>pt</span></span>
            <button onClick={doPause}
              style={{background:"none",border:"1px solid #2a2a44",borderRadius:7,
                padding:DK?"4px 12px":"3px 9px",fontSize:DK?13:10,color:"#666",
                cursor:"pointer",fontFamily:"inherit"}}>
              ⏸ 中断
            </button>
          </div>
        </div>
      </div>
      <div style={S.timerW}>
        <div style={{...S.timerF,width:`${timerPct}%`,background:timerColor,
          animation:phase==="question"&&timeLeft<=5?"timerPulse 0.5s ease infinite":"none"}}/>
        <span style={{...S.timerN,color:timerColor}}>{phase==="question"?(typingDone?`${timeLeft}s`:"--"):""}</span>
      </div>
      <div style={S.qcard}
        className={isFB&&!isNew&&!feedback?.correct?"shake":""}>
        <div style={S.qmeta}>
          {q.type==="fill"?"穴埋め":"選択式"} · {q.pts}点
          {wrongCount>0&&<span style={{color:"#f97316",marginLeft:8,fontSize:11}}>{T.retryN(wrongCount)}</span>}
          {q.type==="fill"&&!isFB&&<span style={{color:"#555",marginLeft:8,fontSize:10}}>{lang==="en"?"← tap to type":"← タップして入力"}</span>}
          {(()=>{
            const sr=srs&&srs[q.id];
            if(!sr||sr.state==="new") return null;
            const STEPS=["10分","1h","6h","1日","3日"];
            let label,color;
            if(sr.state==="learning"){
              label="学習中 "+( STEPS[sr.step]||"?");
              color="#818cf8";
            } else {
              const d=sr.intervalDays||1;
              label=d>=30?`復習 ${Math.round(d/30)}ヶ月`:d>=7?`復習 ${Math.round(d/7)}週`:`復習 ${d}日`;
              color="#34d399";
            }
            return <span style={{marginLeft:8,fontSize:10,color,fontWeight:600}}>{label}</span>;
          })()}
        </div>
        {q.image&&<ZoomableImage src={q.image} alt={q.imageCaption||""} style={{width:"100%",maxHeight:240,objectFit:"contain",borderRadius:8,marginBottom:10,background:"#111"}}/>}
        {q.imageCaption&&q.image&&<p style={{fontSize:11,color:"#888",textAlign:"center",marginBottom:8,marginTop:-6}}>{q.imageCaption}</p>}
        {q.images&&q.images.map((img,i)=>(
          <div key={i} style={{marginBottom:8}}>
            <img src={img.url} alt={img.caption||""} style={{width:"100%",maxHeight:240,objectFit:"contain",borderRadius:8,background:"#111"}}/>
            {img.caption&&<p style={{fontSize:11,color:"#888",textAlign:"center",marginTop:4}}>{img.caption}</p>}
          </div>
        ))}
        {q.type==="mc"?<TypewriterText text={dq.q} qkey={questionKey} style={S.qtxt} onDone={()=>setTypingDone(true)}/>
          :<FillInline key={questionKey} q={q} qkey={questionKey} isNew={isNew&&!isFB} inputs={inputs} dispatch={dispatch}
              isFB={isFB} feedback={feedback} refs={refs} onSubmit={submitFill} ghostingRef={ghostingRef} onDone={()=>setTypingDone(true)}/>}
        {!showHint&&!isFB&&<button style={S.hintBtn} onClick={()=>dispatch({type:"HINT"})}>{T.hintBtn}</button>}
        {q.type==="fill"&&!isFB&&(
          <button style={{...S.btnG,marginTop:10,padding:"10px 28px",fontSize:14}}
            onClick={submitFill} disabled={inputs.some(v=>!v.trim())}>{T.submitBtn}</button>
        )}
        {showHint&&<div style={S.hintBox}>💡 {q.hint}</div>}
        {q.type==="mc"&&(
          <div style={S.optG}>
            {dq.opts.map((opt,i)=>{
              // 新規カード：正解ボタンを薄く金色にハイライト（2秒後）
              const isCorrectOpt=i===dq.ans;
              const ghostHL=isNew&&!isFB&&isCorrectOpt;
              return(
                <button key={i} onClick={()=>submitMC(i)} disabled={isFB}
                  style={{...S.optBtn,
                    background:isFB&&isCorrectOpt?"rgba(34,197,94,0.2)":ghostHL?"rgba(201,168,76,0.12)":"#1a1a2e",
                    border:`1px solid ${isFB&&isCorrectOpt?"#22c55e":ghostHL?"rgba(201,168,76,0.4)":"#2a2a42"}`}}>
                  <span style={S.optL}>{["A","B","C","D"][i]}</span>
                  <span style={{...S.optT,color:ghostHL?"rgba(201,168,76,0.7)":"inherit"}}>{opt}</span>
                </button>
              );
            })}
          </div>
        )}

        {isFB&&isNew&&(
          <div style={{marginTop:12}}>

/* ── NextDNS 報酬オーバーレイ ── */
function RewardOverlay({rewardStatus,rewardSecs,fmtSecs,onClose}){
  const pct=rewardSecs/(5*60);

  if(rewardStatus==='unlocking') return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:9999,background:'rgba(29,161,242,0.97)',padding:'14px 20px',display:'flex',alignItems:'center',gap:12,animation:'rewardIn 0.4s ease',boxShadow:'0 4px 24px rgba(29,161,242,0.5)'}}>
      <span style={{fontSize:28,animation:'tweetBird 1s ease infinite'}}>🐦</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:900,fontSize:15,color:'#fff'}}>Twitter 解放中…</div>
        <div style={{fontSize:12,color:'rgba(255,255,255,0.8)'}}>NextDNS のブロックを解除しています</div>
      </div>
    </div>
  );
  if(rewardStatus==='error') return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:9999,background:'rgba(239,68,68,0.97)',padding:'14px 20px',display:'flex',alignItems:'center',gap:12,animation:'rewardIn 0.4s ease'}}>
      <span style={{fontSize:26}}>⚠️</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:900,fontSize:14,color:'#fff'}}>API エラー</div>
        <div style={{fontSize:11,color:'rgba(255,255,255,0.9)'}}>CORS 制限の可能性あり。APIキー・Profile IDを確認してください。</div>
      </div>

    </div>
  );
  if(rewardStatus==='relocking') return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:9999,background:'rgba(100,100,100,0.97)',padding:'14px 20px',display:'flex',alignItems:'center',gap:12,animation:'rewardIn 0.4s ease'}}>

/* ── ZoomableImage：タップで全画面・ピンチズーム ── */
function ZoomableImage({src,alt,style}){
  const[open,setOpen]=useState(false);
  const[scale,setScale]=useState(1);
  const[pos,setPos]=useState({x:0,y:0});
  const lastDist=useRef(null);
  const lastPos=useRef(null);
  const isDragging=useRef(false);

  const dist=(t)=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  const mid=(t)=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});

  const onTouchStart=e=>{
    if(e.touches.length===2){
      lastDist.current=dist(e.touches);
      lastPos.current=mid(e.touches);
      isDragging.current=false;
    } else if(e.touches.length===1){
      lastPos.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
      isDragging.current=true;
    }
  };
  const onTouchMove=e=>{
    e.preventDefault();
    if(e.touches.length===2){
      const d=dist(e.touches);
      const m=mid(e.touches);
      if(lastDist.current){
        const ratio=d/lastDist.current;
        setScale(s=>Math.min(Math.max(s*ratio,1),5));
        if(lastPos.current){
          setPos(p=>({x:p.x+(m.x-lastPos.current.x),y:p.y+(m.y-lastPos.current.y)}));
        }
      }
      lastDist.current=d;
      lastPos.current=m;
      isDragging.current=false;
    } else if(e.touches.length===1&&isDragging.current&&scale>1){
      const dx=e.touches[0].clientX-lastPos.current.x;
      const dy=e.touches[0].clientY-lastPos.current.y;
      setPos(p=>({x:p.x+dx,y:p.y+dy}));
      lastPos.current={x:e.touches[0].clientX,y:e.touches[0].clientY};
    }
  };
  const onTouchEnd=()=>{lastDist.current=null;};
  const close=()=>{setOpen(false);setScale(1);setPos({x:0,y:0});};

  return(<>
    <img src={src} alt={alt||""} style={{...style,cursor:"zoom-in"}} onClick={()=>setOpen(true)}/>
    {open&&(
      <div onClick={close}
        style={{position:"fixed",inset:0,zIndex:99999,background:"rgba(0,0,0,0.92)",
          display:"flex",alignItems:"center",justifyContent:"center",touchAction:"none"}}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
        <img src={src} alt={alt||""}
          style={{maxWidth:"100vw",maxHeight:"100vh",objectFit:"contain",
            transform:`scale(${scale}) translate(${pos.x/scale}px,${pos.y/scale}px)`,
            transformOrigin:"center",userSelect:"none",pointerEvents:"none"}}
          onClick={e=>e.stopPropagation()}/>
        <div style={{position:"fixed",top:16,right:16,color:"#fff",fontSize:24,cursor:"pointer",
          background:"rgba(0,0,0,0.5)",borderRadius:"50%",width:36,height:36,
          display:"flex",alignItems:"center",justifyContent:"center"}}
          onClick={close}>✕</div>
        {scale>1&&(
          <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",
            color:"#888",fontSize:11,background:"rgba(0,0,0,0.5)",padding:"4px 10px",borderRadius:8}}>
            ダブルタップでリセット
          </div>
        )}
      </div>
    )}
  </>);
}
